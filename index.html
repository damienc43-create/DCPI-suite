<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCPI · Suite</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23343A3C'/%3E%3Cpath d='M10 44 L22 28 L30 38 L42 20 L54 44' fill='none' stroke='%234FA36E' stroke-width='6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Charte DCPI */
  --basalte:#343A3C; --vert:#286747; --vert-clair:#4FA36E; --cuivre:#B58B62; --mineral:#F4F2EC;
  --bg:var(--mineral); --card:#FFFFFF; --ink:#262B2D; --muted:#6E7471; --line:#E1DED5;
  --ok:#2E8B57; --warn:#C98A00; --bad:#C0392B; --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Lato,"Segoe UI",system-ui,Arial,sans-serif}
h1,h2,h3,.logo,nav.tabs button,.btn,.kpi b,th,.badge,.fiche h1{font-family:Montserrat,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 .5em;line-height:1.2}
h2{font-size:1.25rem} h3{font-size:1.02rem}
a{color:var(--vert)}
[hidden]{display:none!important}

/* ---------- Logo ---------- */
.logo{display:inline-block;line-height:0}
.logo svg{display:block;width:100%;height:auto}
header .logo{width:150px}
#login .logo{width:300px;max-width:100%;margin-bottom:8px}

/* ---------- Header ---------- */
header.top{background:var(--basalte);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.top-row{display:flex;align-items:center;gap:16px;padding:10px 16px;max-width:1280px;margin:0 auto}
.top-row .spacer{flex:1}
.who{font-size:.82rem;opacity:.85;text-align:right}
.who button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:2px 8px;cursor:pointer;margin-left:6px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1280px;margin:0 auto;padding:0 10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:rgba(255,255,255,.75);padding:9px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-weight:600}
nav.tabs button.on{color:#fff;border-bottom-color:var(--cuivre)}
.demo-banner{background:#FFF4E0;color:#7A4B00;text-align:center;padding:6px 16px;font-size:.85rem;border-bottom:1px solid #F0D9B0}

main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}

/* ---------- UI primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--vert)}
.btn.primary{background:var(--basalte);border-color:var(--basalte);color:#fff}
.btn.primary:hover{background:var(--vert)}
.btn.accent{background:var(--cuivre);border-color:var(--cuivre);color:#fff}
.btn.danger{color:var(--bad);border-color:#EBC5C0}
.btn.sm{padding:3px 9px;font-size:.82rem;font-weight:600}
.btn.link{border:0;background:none;padding:2px 4px;color:var(--vert)}
input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #BFDCC9;border-color:var(--vert)}
textarea{min-height:70px;resize:vertical}
.fld label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:3px;font-weight:600}
.grid-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.grid-form .full{grid-column:1/-1}
.grid-form .span2{grid-column:span 2}
@media (max-width:600px){.grid-form{grid-template-columns:1fr}.grid-form .span2{grid-column:auto}}
.chk{display:flex!important;align-items:center;gap:8px;font-weight:600;font-size:.9rem;color:var(--ink)!important;padding-top:20px}
.chk input{width:auto}
.muted{color:var(--muted)}
.small{font-size:.83rem}
.empty{color:var(--muted);font-style:italic;padding:8px 0}
.badge{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:20px;background:#ECE9E1;color:var(--basalte);white-space:nowrap}
.b-Prospect{background:#FFF1DC;color:#8A5300}
.b-Client{background:#DFF3E7;color:#1F6B42}
.b-Inactif,.b-Perdu{background:#EEE;color:#666}
.b-Proposition{background:#FFF1DC;color:#8A5300}
.b-En-cours{background:#DCEBFA;color:#1D4F8C}
.b-En-pause{background:#F3E8FA;color:#6B3A8A}
.b-Termine,.b-Fait{background:#DFF3E7;color:#1F6B42}
.b-A-faire{background:#EEE;color:#555}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700}
td.num,th.num{text-align:right;white-space:nowrap}
th.sort{cursor:pointer;user-select:none} th.sort:hover{color:var(--ink)} th.sort.on{color:var(--vert)}
.lst td{white-space:nowrap} .lst td.wrap{white-space:normal;min-width:180px}
.lst tfoot td{font-weight:800;border-top:2px solid var(--basalte);background:#F8F7F2}
tr.click{cursor:pointer} tr.click:hover td{background:#F8F7F2}
.table-wrap{overflow-x:auto}
.bar{height:7px;background:#ECE9E1;border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--vert)}
.bar.over i{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.kpi b{display:block;font-size:1.6rem;color:var(--basalte)}
.kpi span{font-size:.82rem;color:var(--muted)}
.two{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.two-eq{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:860px){.two,.two-eq{grid-template-columns:1fr}}
.list-item{padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.list-item:hover{background:#F3F1EA}
.list-item.on{background:#E3EFE6;border-color:#B9D6C2}
.list-item .t{font-weight:700}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 16px;margin:6px 0 4px}
.info div small{display:block;color:var(--muted);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.sec{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.late{color:var(--bad);font-weight:700}
.day-h{display:flex;justify-content:space-between;background:#ECE9E1;padding:6px 10px;border-radius:6px;font-weight:700;margin-top:10px;text-transform:capitalize}
.wk-title{font-family:Montserrat,sans-serif;font-weight:800;font-size:1.15rem}
.seg{display:inline-flex;gap:2px;background:#ECE9E1;border-radius:8px;padding:2px}
.seg .btn{border:0;background:none}.seg .btn.on{background:var(--basalte);color:#fff}
.wk-grid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.wk-day{padding:10px;border-right:1px solid var(--line);min-height:220px;background:#fff}
.wk-day:last-child{border-right:0}
.wk-day.today{background:#F5FAF6}
.wk-day.today .wk-dh{border-bottom:2px solid var(--vert);padding-bottom:6px}
.wk-day.today .wk-lab{color:var(--vert)}
.wk-dh{display:flex;justify-content:space-between;align-items:flex-start}
.wk-lab{font-size:.74rem;font-weight:800;letter-spacing:.06em;color:var(--muted);font-family:Montserrat,sans-serif}
.wk-tot{font-weight:800;font-family:Montserrat,sans-serif}
.wk-plus{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#F3F1EA;cursor:pointer;font-weight:700;line-height:1}
.wk-plus:hover{background:var(--vert);color:#fff;border-color:var(--vert)}
.wk-card{border-left:4px solid var(--vert);background:#F7F6F1;border-radius:6px;padding:6px 8px;margin-bottom:6px;cursor:pointer;font-size:.82rem}
.wk-card:hover{background:#EFEDE5}
.wk-h{font-weight:800;font-size:.78rem}
.wk-sub{color:var(--ink);font-size:.78rem}
.wk-desc{color:var(--muted);font-size:.76rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wk-add{width:100%;border:1px dashed #D6D2C6;background:none;border-radius:6px;padding:9px;color:var(--muted);cursor:pointer;font-size:.82rem}
.wk-add:hover{border-color:var(--vert);color:var(--vert)}
@media (max-width:760px){.wk-grid{grid-template-columns:1fr}.wk-day{border-right:0;border-bottom:1px solid var(--line);min-height:0}}
.mo-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mo-h{font-size:.74rem;font-weight:800;color:var(--muted);text-align:center;font-family:Montserrat,sans-serif;padding:4px}
.mo-c{background:#fff;border:1px solid var(--line);border-radius:6px;min-height:78px;padding:5px;cursor:pointer;font-size:.8rem}
.mo-c:hover{border-color:var(--vert)}.mo-c.out{opacity:.4}.mo-c.today{border:2px solid var(--vert)}
.mo-n{font-weight:700;color:var(--muted)}
.mo-tag{color:#fff;border-radius:4px;padding:1px 5px;font-size:.7rem;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.journal-item{padding:8px 0;border-bottom:1px solid var(--line)}

/* ---------- Modal & toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,25,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:100;overflow-y:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.modal .actions .left{margin-right:auto}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;z-index:200;font-size:.9rem;max-width:90vw}
#toast.err{background:var(--bad)}

/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--basalte) 55%,var(--vert));padding:16px}
#login .box{background:#fff;border-radius:14px;padding:34px 30px;max-width:380px;width:100%;text-align:center}
#login p{color:var(--muted)}
#login .err{color:var(--bad);font-weight:600;min-height:1.2em}

/* ---------- Fiche de pointage ---------- */
.fiche-wrap{background:#E4E1D8;padding:18px;border-radius:var(--radius);overflow-x:auto}
.fiche{background:#fff;width:210mm;min-height:280mm;margin:0 auto;padding:14mm 13mm;color:#1C2430;font-size:10pt;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.fiche .f-head{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--cuivre);padding-bottom:10px}
.fiche .f-head .logo{width:66mm}
.fiche .f-ident{font-size:8.5pt;color:#444;margin-top:6px;line-height:1.35}
.fiche .f-title{text-align:right}
.fiche .f-title h1{font-size:15pt;color:var(--basalte);letter-spacing:.04em;margin:0}
.fiche .f-title div{font-size:9pt;color:#444}
.fiche .f-blocks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.fiche .f-block{border:1px solid #D6D2C6;border-radius:6px;padding:8px 10px;font-size:9pt}
.fiche .f-block b.h{display:block;font-size:7.5pt;text-transform:uppercase;letter-spacing:.06em;color:var(--cuivre);margin-bottom:3px}
.fiche table{font-size:8.8pt}
.fiche th{background:var(--basalte);color:#fff;font-size:7.5pt;padding:5px 6px}
.fiche td{padding:4px 6px;border-bottom:1px solid #E6E3DB}
.fiche tr.sub td{background:#F1EFE8;font-weight:700}
.fiche tr.tot td{background:var(--vert);color:#fff;font-weight:800}
.fiche tr.mt td{font-weight:700}
.fiche .f-visa{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px;page-break-inside:avoid}
.fiche .f-visa div{border:1px solid #D6D2C6;border-radius:6px;padding:8px 10px;min-height:34mm;font-size:8.8pt}
.fiche .f-visa b{display:block;color:var(--basalte);margin-bottom:4px}
.fiche .f-foot{margin-top:14px;font-size:7.5pt;color:#777;text-align:center;border-top:1px solid #DDD;padding-top:6px}
#print-area{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  body > *:not(#print-area){display:none!important}
  #print-area{display:block}
  #print-area .fiche{box-shadow:none;margin:0;width:auto;min-height:0}
  .fiche th,.fiche tr.tot td,.fiche tr.sub td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<!-- ============ ÉCRAN DE CONNEXION ============ -->
<div id="login" hidden>
  <div class="box">
    <div class="logo dark" data-logo></div>
    <p>Suite de gestion : CRM, projets, pointages</p>
    <button class="btn primary" id="btn-login" style="width:100%;padding:11px">Se connecter avec Google</button>
    <p class="err" id="login-err"></p>
  </div>
</div>

<!-- ============ APPLICATION ============ -->
<div id="app" hidden>
  <header class="top">
    <div class="top-row">
      <div class="logo" data-logo></div>
      <div class="spacer"></div>
      <div class="who" id="who"></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="accueil">Accueil</button>
      <button data-view="pointages">Pointages</button>
      <button data-view="liste">Liste des projets</button>
      <button data-view="projets">Suivi projet</button>
      <button data-view="crm">CRM</button>
      <button data-view="partenaires">Fournisseurs &amp; partenaires</button>
      <button data-view="fiches">Fiches de pointage</button>
      <button data-view="reglages">Réglages</button>
    </nav>
  </header>
  <div class="demo-banner" id="demo-banner" hidden>
    Mode démo : les données restent dans ce navigateur. Renseignez la configuration Firebase pour l'usage réel (voir le guide).
  </div>
  <main id="view"></main>
</div>

<div id="modal-root"></div>
<div id="toast" hidden></div>
<div id="print-area"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
'use strict';
/* =====================================================================
   CONFIGURATION — à compléter (voir GUIDE-INSTALLATION.md)
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBXqWqJ8LZX--2vxDkjP-u-O9SO2gKnmbk",
  authDomain: "dc-pi-17ec8.firebaseapp.com",
  projectId: "dc-pi-17ec8",
  storageBucket: "dc-pi-17ec8.firebasestorage.app",
  messagingSenderId: "122109183647",
  appId: "1:122109183647:web:b82604b41e17119c4284aa"
};
// Seule adresse autorisée à se connecter (la même que dans firestore.rules)
const ALLOWED_EMAIL = "damienc43@gmail.com";

/* ===================================================================== */
const APP_VERSION = '1.0';
const DEMO = FIREBASE_CONFIG.apiKey === 'A_REMPLIR';
const SDK_KO = !DEMO && typeof firebase === 'undefined';  // config présente mais Firebase non chargé
const COLS = ['clients', 'interactions', 'projets', 'pointages', 'partenaires'];
const DEFAULT_SETTINGS = {
  nom: 'DCPI', mention: 'Projets & Ingénierie', slogan: 'Vos projets, de l\'idée à la réalisation.', raisonSociale: '', adresse: '', cp: '', ville: '',
  siret: '', email: '', tel: '', heuresJour: 7, lastBackup: ''
};
const CLIENT_STATUTS = ['Prospect', 'Client', 'Inactif'];
const PROJET_STATUTS = ['Proposition', 'En cours', 'En pause', 'Terminé', 'Perdu'];
const PROJET_ACTIFS = ['Proposition', 'En cours', 'En pause'];
const FACTURATIONS = ['Régie (TJM)', 'Forfait'];
const TACHE_STATUTS = ['À faire', 'En cours', 'Fait'];
const LIEUX = ['Sur site client', 'Bureau', 'À distance', 'Déplacement'];
const INTER_TYPES = ['Appel', 'Rendez-vous', 'E-mail', 'Visite', 'Proposition envoyée', 'Demande de devis', 'Devis reçu', 'Autre'];
const PART_TYPES = ['Fournisseur', 'Sous-traitant', 'Bureau d\'études', 'Constructeur / intégrateur', 'Partenaire', 'Prestataire de services', 'Autre'];
const PART_STATUTS = ['Actif', 'À qualifier', 'Inactif'];

let DB = { clients: [], interactions: [], projets: [], pointages: [], partenaires: [] };
let SETTINGS = { ...DEFAULT_SETTINGS };
let VIEW = 'accueil';
let USER = null;

/* ---------- Utilitaires ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const toISO = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d || 1); };
const todayStr = () => toISO(new Date());
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return toISO(d); };
const mondayOf = s => { const d = parseISO(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return toISO(d); };
function isoWeek(s) {
  const d = parseISO(s); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const w1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7);
}
const lastDayOfMonth = ym => { const [y, m] = ym.split('-').map(Number); return ym + '-' + pad(new Date(y, m, 0).getDate()); };
const fmtDate = s => s ? parseISO(s).toLocaleDateString('fr-FR') : '';
const fmtDay = s => parseISO(s).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtMonth = ym => parseISO(ym + '-01').toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
const num = (n, dec = 2) => (Math.round((+n || 0) * 10 ** dec) / 10 ** dec).toLocaleString('fr-FR', { maximumFractionDigits: dec });
const eur = n => (+n || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
const hJ = () => +SETTINGS.heuresJour || 7;
const jours = h => (+h || 0) / hJ();
const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');
const badge = s => `<span class="badge b-${slug(s)}">${esc(s)}</span>`;
// CP + ville (compatibilité avec l'ancien champ unique cpVille)
const splitCpVille = s => { const m = String(s || '').trim().match(/^(\d{5})\s*(.*)$/); return m ? { cp: m[1], ville: m[2] } : { cp: '', ville: String(s || '').trim() }; };
const withCpVille = o => (o && !o.cp && !o.ville && o.cpVille) ? { ...o, ...splitCpVille(o.cpVille) } : o;
const cpv = o => { const x = withCpVille(o || {}); return [x.cp, x.ville].filter(Boolean).join(' '); };
const nomContact = x => [x?.prenom, x?.nom].filter(Boolean).join(' ');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sum = (arr, f) => arr.reduce((a, x) => a + (+f(x) || 0), 0);
const byId = (col, id) => DB[col].find(x => x.id === id);
const clientNom = id => byId('clients', id)?.nom || '—';
const projetLabel = p => p ? `${p.code} — ${p.nom}` : '—';
const heuresProjet = (pid, onlyFact = false) => sum(DB.pointages.filter(x => x.projetId === pid && (!onlyFact || x.facturable)), x => x.heures);

// Logo conforme à la charte DCPI : DC + double crête vert sapin + PI, mention espacée,
// ligne de cotation et slogan. SVG unique avec largeurs imposées (textLength) pour garder
// les proportions même si la police Montserrat n'est pas chargée.
function logoHTML(full = false, dark = false) {
  const ink = dark ? '#FFFFFF' : '#343A3C', green = dark ? '#4FA36E' : '#286747';
  const F = `font-family="Montserrat,'Segoe UI',Arial,sans-serif"`;
  const m = esc((SETTINGS.mention || '').toUpperCase()).replace('&amp;', `<tspan fill="${green}">&amp;</tspan>`);
  const h = full ? 156 : (m ? 106 : 76);

/* =====================================================================
   STOCKAGE — Firestore (réel) ou localStorage (démo)
   Chaque écriture porte sur UN document : jamais d'écrasement global.
   ===================================================================== */
const DEMO_KEY = 'dcpi_demo_v1';
const Store = {
  fs: null, unsubs: [],
  start() {
    if (DEMO) {
      try {
        const raw = JSON.parse(localStorage.getItem(DEMO_KEY) || 'null');
        if (raw) { COLS.forEach(c => DB[c] = raw.db?.[c] || []); SETTINGS = { ...DEFAULT_SETTINGS, ...(raw.settings || {}) }; }
      } catch (e) { console.warn(e); }
      render(); return;
    }
    const fs = this.fs, loaded = new Set();
    const markLoaded = k => { if (loaded.has(k)) return; loaded.add(k); if (loaded.size === COLS.length + 1) autoBackup(); };
    COLS.forEach(c => this.unsubs.push(fs.collection(c).onSnapshot(
      s => { DB[c] = s.docs.map(d => ({ ...d.data(), id: d.id })); render(); markLoaded(c); },
      err => toast(`Lecture « ${c} » impossible : ${err.message}`, true))));
    this.unsubs.push(fs.collection('config').doc('settings').onSnapshot(
      d => { SETTINGS = { ...DEFAULT_SETTINGS, ...(d.exists ? d.data() : {}) }; render(); markLoaded('settings'); },
      err => toast('Lecture des réglages impossible : ' + err.message, true)));
  },
  stop() { this.unsubs.forEach(u => u()); this.unsubs = []; DB = { clients: [], interactions: [], projets: [], pointages: [], partenaires: [] }; },
  persistDemo() {
    try { localStorage.setItem(DEMO_KEY, JSON.stringify({ db: DB, settings: SETTINGS })); }
    catch (e) { toast('Stockage local impossible : ' + e.message, true); }
  },
  async save(col, obj, keepDates = false) {
    const o = JSON.parse(JSON.stringify(obj));       // retire les undefined
    let id = o.id; delete o.id;
    if (!keepDates || !o.updatedAt) o.updatedAt = new Date().toISOString();
    if (!o.createdAt) o.createdAt = o.updatedAt;
    if (DEMO) {
      if (!id) id = uid();
      const arr = DB[col], i = arr.findIndex(x => x.id === id), rec = { ...o, id };
      if (i >= 0) arr[i] = rec; else arr.push(rec);
      this.persistDemo(); render(); return id;
    }
    if (!id) id = this.fs.collection(col).doc().id;
    await this.fs.collection(col).doc(id).set(o);
    return id;
  },
  async remove(col, id) {
    if (DEMO) { DB[col] = DB[col].filter(x => x.id !== id); this.persistDemo(); render(); return; }
    await this.fs.collection(col).doc(id).delete();
  },
  async saveSettings(patch) {
    SETTINGS = { ...SETTINGS, ...patch };
    if (DEMO) { this.persistDemo(); render(); return; }
    await this.fs.collection('config').doc('settings').set(JSON.parse(JSON.stringify(patch)), { merge: true });
  }
};
async function safe(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e) { console.error(e); toast('Erreur : ' + e.message, true); }
}

function optHTML(options, v) {
  return options.map(o => {
    const val = typeof o === 'object' ? o.v : o, lab = typeof o === 'object' ? o.l : o;
    return `<option value="${esc(val)}" ${String(val) === String(v ?? '') ? 'selected' : ''}>${esc(lab)}</option>`;
  }).join('');
}
function fieldHTML(f, v) {
  const id = 'f_' + f.k, cls = 'fld' + (f.full ? ' full' : '');
  if (f.type === 'checkbox') return `<label class="${cls} chk"><input type="checkbox" name="${f.k}" ${v ? 'checked' : ''}> ${esc(f.label)}</label>`;
  let input;
  if (f.type === 'select') input = `<select name="${f.k}" id="${id}" ${f.required ? 'required' : ''}>${optHTML(f.options, v)}</select>`;
  else if (f.type === 'textarea') input = `<textarea name="${f.k}" id="${id}">${esc(v)}</textarea>`;
  else input = `<input type="${f.type || 'text'}" name="${f.k}" id="${id}" value="${esc(v)}" ${f.step ? `step="${f.step}"` : ''} ${f.min !== undefined ? `min="${f.min}"` : ''} ${f.required ? 'required' : ''} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''}>`;
  return `<div class="${cls}"><label for="${id}">${esc(f.label)}${f.required ? ' *' : ''}</label>${input}</div>`;
}
function closeModal() { $('#modal-root').innerHTML = ''; }
function formModal(title, fields, values, onSubmit, opts = {}) {
  values = values || {};
  $('#modal-root').innerHTML = `
    <div class="modal-bg"><form class="modal" id="mform" novalidate>
      <h2>${esc(title)}</h2>
      ${opts.intro ? `<p class="muted small">${opts.intro}</p>` : ''}
      <div class="grid-form">${fields.map(f => fieldHTML(f, values[f.k] ?? f.def)).join('')}</div>
      <div class="actions">
        ${opts.onDelete ? `<button type="button" class="btn danger left" id="m-del">Supprimer</button>` : ''}
        <button type="button" class="btn" id="m-cancel">Annuler</button>
        <button type="submit" class="btn primary">${esc(opts.submitLabel || 'Enregistrer')}</button>
      </div>
    </form></div>`;
  const form = $('#mform');
  $('#m-cancel').onclick = closeModal;
  if (opts.onDelete) $('#m-del').onclick = async () => { if (confirm('Confirmer la suppression ?')) { await opts.onDelete(); closeModal(); } };
  form.onsubmit = async e => {
    e.preventDefault();
    const out = {};
    for (const f of fields) {
      const el = form.elements[f.k];
      if (f.type === 'checkbox') out[f.k] = el.checked;
      else if (f.type === 'number') out[f.k] = el.value === '' ? null : parseFloat(String(el.value).replace(',', '.'));
      else out[f.k] = el.value.trim();
      if (f.required && (out[f.k] === '' || out[f.k] === null)) { toast(`Champ obligatoire : ${f.label}`, true); el.focus(); return; }
    }
    try { if (await onSubmit(out) !== false) closeModal(); }
    catch (err) { console.error(err); toast('Erreur : ' + err.message, true); }
  };
  opts.onOpen?.(form);
  setTimeout(() => { if (!form.contains(document.activeElement)) form.querySelector('input,select,textarea')?.focus(); }, 30);

const PRJ = { filtre: 'actifs', sel: null };
// Codes : client sur 4 lettres (ex. MJ Valorisation → MJVA), projet = CODECLIENT-NN (ex. MJVA-01)
const FORMES = ['SAS', 'SASU', 'SARL', 'EURL', 'SA', 'SCI', 'SNC', 'STE', 'SOCIETE', 'ETS', 'GROUPE', 'LES', 'LA', 'LE', 'L', 'DE', 'DU', 'DES', 'ET'];
function suggestCode(nom) {
  const mots = String(nom || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().split(/[^A-Z0-9]+/).filter(m => m && !FORMES.includes(m));
  if (!mots.length) return '';
  let code = mots[0].length >= 4 ? mots[0].slice(0, 4) : mots[0];
  for (let i = 1; code.length < 4 && i < mots.length; i++) code += mots[i].slice(0, 4 - code.length >= 2 ? 2 : 4 - code.length);
  return code.slice(0, 4);
}
const clientCode = c => (c?.code || suggestCode(c?.nom)).toUpperCase();
function nextProjetCode(clientId) {
  const c = byId('clients', clientId); if (!c) return '';
  const pre = clientCode(c) + '-';
  const max = DB.projets.map(p => p.code || '').filter(x => x.startsWith(pre)).map(x => parseInt(x.slice(pre.length), 10) || 0).reduce((a, b) => Math.max(a, b), 0);
  return pre + String(max + 1).padStart(2, '0');
}

const LST = { q: '', statut: 'tous', client: '', annee: '', sort: 'code', dir: -1 };
function projetRow(p) {
  const regie = p.facturation !== 'Forfait';
  const h = heuresProjet(p.id), hf = heuresProjet(p.id, true);
  const pts = DB.pointages.filter(x => x.projetId === p.id).map(x => x.date).sort();
  return {
    p, id: p.id, code: p.code || '', nom: p.nom || '', client: clientNom(p.clientId), statut: p.statut || '', facturation: regie ? 'Régie' : 'Forfait',
    tjm: regie ? (+p.tjm || 0) : null,
    prevu: regie ? (+p.budgetJours || 0) * (+p.tjm || 0) : (+p.montantForfait || 0),
    budget: +p.budgetJours || 0, pointe: jours(h),
    pct: p.budgetJours ? jours(h) / p.budgetJours * 100 : null,
    realise: regie ? jours(hf) * (+p.tjm || 0) : (+p.montantForfait || 0) * (p.budgetJours ? Math.min(jours(h) / p.budgetJours, 1) : 0),
    debut: p.dateDebut || '', fin: p.dateFin || '', dernier: pts[pts.length - 1] || ''
  };
}
const LST_COLS = [
  { k: 'code', l: 'Code' }, { k: 'nom', l: 'Intitulé', wrap: true }, { k: 'client', l: 'Client' }, { k: 'statut', l: 'Statut' },
  { k: 'facturation', l: 'Fact.' }, { k: 'prevu', l: 'Montant prévu HT', num: true, eur: true }, { k: 'budget', l: 'Budget j', num: true },
  { k: 'pointe', l: 'Pointé j', num: true }, { k: 'pct', l: '% conso', num: true }, { k: 'realise', l: 'Réalisé HT', num: true, eur: true },
  { k: 'debut', l: 'Début', date: true }, { k: 'fin', l: 'Échéance', date: true }, { k: 'dernier', l: 'Dernier pointage', date: true }
];
function listeRows() {
  const q = LST.q.toLowerCase();
  return DB.projets.filter(p =>
    (LST.statut === 'tous' || (LST.statut === 'actifs' ? PROJET_ACTIFS.includes(p.statut) : p.statut === LST.statut)) &&
    (!LST.client || p.clientId === LST.client) &&
    (!LST.annee || (p.dateDebut || p.createdAt || '').startsWith(LST.annee)) &&
    (!q || [p.code, p.nom, clientNom(p.clientId), p.refClient, p.description].join(' ').toLowerCase().includes(q)))
    .map(projetRow)
    .sort((a, b) => {
      const x = a[LST.sort], y = b[LST.sort];
      const c = (typeof x === 'number' || typeof y === 'number') ? (x ?? -1) - (y ?? -1) : String(x).localeCompare(String(y), 'fr');
      return c * LST.dir;
    });
}
function listeTableHTML() {
  const rows = listeRows();
  if (!rows.length) return '<div class="empty">Aucun projet pour ces filtres.</div>';
  const cell = (c, r) => {
    const v = r[c.k];
    if (c.k === 'statut') return badge(v);
    if (c.k === 'code') return `<b>${esc(v)}</b>`;
    if (c.k === 'pct') return v == null ? '' : `<span class="${v > 100 ? 'late' : ''}">${num(v, 0)} %</span><div class="bar ${v > 100 ? 'over' : ''}"><i style="width:${Math.min(v, 100)}%"></i></div>`;
    if (c.k === 'fin') return `<span class="${v && v < todayStr() && PROJET_ACTIFS.includes(r.statut) ? 'late' : ''}">${fmtDate(v)}</span>`;
    if (c.date) return fmtDate(v);
    if (c.eur) return v ? eur(v) : '';
    if (c.num) return v ? num(v) : '';
    return esc(v);
  };
  const T = k => sum(rows, r => r[k]);
  return `<div class="table-wrap"><table class="lst"><thead><tr>${LST_COLS.map(c => `<th class="sort ${c.num ? 'num' : ''} ${LST.sort === c.k ? 'on' : ''}" data-act="lst-sort" data-id="${c.k}">${esc(c.l)}${LST.sort === c.k ? (LST.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr class="click" data-act="prj-open" data-id="${r.id}">${LST_COLS.map(c => `<td class="${c.num ? 'num' : ''} ${c.wrap ? 'wrap' : ''}">${cell(c, r)}</td>`).join('')}</tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="5">${rows.length} projet${rows.length > 1 ? 's' : ''}</td><td class="num">${eur(T('prevu'))}</td><td class="num">${num(T('budget'))}</td><td class="num">${num(T('pointe'))}</td>
      <td class="num">${T('budget') ? num(T('pointe') / T('budget') * 100, 0) + ' %' : ''}</td><td class="num">${eur(T('realise'))}</td><td colspan="3"></td></tr></tfoot>
  </table></div>`;
}

  const f = $('#lst-form'); if (!f) return;

function exportListeCSV() {
  const rows = listeRows();
  const n = v => v == null || v === '' ? '' : String(Math.round(v * 100) / 100).replace('.', ',');
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [LST_COLS.map(c => q(c.l)).join(';')].concat(rows.map(r => LST_COLS.map(c => c.num ? n(r[c.k]) : c.date ? q(fmtDate(r[c.k])) : q(r[c.k])).join(';')));

      await safe(async () => {

      }, 'Client supprimé');

// Code postal → propose la ou les communes (API publique geo.api.gouv.fr, sans clé)
function villeAuto(form) {
  const cp = form.elements.cp, ville = form.elements.ville; if (!cp || !ville) return;
  const dl = document.createElement('datalist'); dl.id = 'dl-' + uid(); form.appendChild(dl); ville.setAttribute('list', dl.id);
  cp.addEventListener('input', async () => {
    const v = cp.value.trim(); if (!/^\d{5}$/.test(v)) return;
    try {
      const r = await fetch(`https://geo.api.gouv.fr/communes?codePostal=${v}&fields=nom&format=json`);
      const noms = (await r.json()).map(x => x.nom).sort((a, b) => a.localeCompare(b, 'fr'));
      dl.innerHTML = noms.map(n => `<option value="${esc(n)}">`).join('');
      if (noms.length === 1 || (noms.length && !ville.value.trim())) ville.value = noms[0];
    } catch (e) { /* hors ligne : saisie manuelle */ }
  });
}

/* ---------- FICHES DE POINTAGE ---------- */
const FI = { clientId: '', projetId: '', mode: 'mois', mois: todayStr().slice(0, 7), du: '', au: '', factOnly: true, montant: false, detail: true };
function fichePeriode() {
  return FI.mode === 'mois' ? { du: FI.mois + '-01', au: lastDayOfMonth(FI.mois), label: fmtMonth(FI.mois) }
    : { du: FI.du, au: FI.au, label: `du ${fmtDate(FI.du)} au ${fmtDate(FI.au)}` };
}
function ficheHTML() {
  const c = byId('clients', FI.clientId);
  if (!c) return '<p class="empty">Choisissez un client.</p>';
  const per = fichePeriode();
  if (!per.du || !per.au) return '<p class="empty">Indiquez la période.</p>';
  const prjIds = DB.projets.filter(p => p.clientId === c.id && (!FI.projetId || p.id === FI.projetId)).map(p => p.id);
  const pts = DB.pointages.filter(x => prjIds.includes(x.projetId) && x.date >= per.du && x.date <= per.au && (!FI.factOnly || x.facturable))
    .sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || '').localeCompare(b.createdAt || ''));
  if (!pts.length) return '<p class="empty">Aucun pointage pour ce client sur cette période.</p>';
  const groups = prjIds.map(id => byId('projets', id)).filter(p => pts.some(x => x.projetId === p.id))
    .sort((a, b) => a.code.localeCompare(b.code));
  const contact = (c.contacts || []).find(x => x.principal) || (c.contacts || [])[0];
  const ref = `FP-${per.du.slice(0, 7).replace('-', '')}-${FI.projetId ? byId('projets', FI.projetId).code : clientCode(c)}`;
  const S = SETTINGS;
  let rows = '', totH = 0, totM = 0, hasM = false;
  const colspan = FI.detail ? 4 : 1;
  for (const p of groups) {
    const items = pts.filter(x => x.projetId === p.id), h = sum(items, x => x.heures);
    totH += h;
    rows += `<tr class="sub"><td colspan="${colspan + 2}">${esc(p.code)} — ${esc(p.nom)}${p.refClient ? ` <span style="font-weight:400">(réf. ${esc(p.refClient)})</span>` : ''}</td></tr>`;
    if (FI.detail) rows += items.map(x => `<tr><td>${fmtDate(x.date)}</td><td>${esc(p.taches?.find(t => t.id === x.tacheId)?.nom || '')}</td><td>${esc(x.description || '')}</td><td>${esc(x.lieu || '')}</td><td class="num">${num(x.heures)}</td><td class="num">${num(jours(x.heures))}</td></tr>`).join('');
    rows += `<tr class="sub"><td colspan="${colspan}" style="text-align:right">Sous-total ${esc(p.code)}</td><td class="num">${num(h)}</td><td class="num">${num(jours(h))}</td></tr>`;
    if (FI.montant && p.facturation !== 'Forfait' && p.tjm) {
      hasM = true; const m = jours(h) * p.tjm; totM += m;
      rows += `<tr class="mt"><td colspan="${colspan}" style="text-align:right">Montant HT (${num(jours(h))} j × ${eur(p.tjm)})</td><td colspan="2" class="num">${eur(m)}</td></tr>`;
    }
  }
  rows += `<tr class="tot"><td colspan="${colspan}" style="text-align:right">TOTAL PÉRIODE</td><td class="num">${num(totH)} h</td><td class="num">${num(jours(totH))} j</td></tr>`;
  if (hasM) rows += `<tr class="mt"><td colspan="${colspan}" style="text-align:right">TOTAL HT</td><td colspan="2" class="num">${eur(totM)}</td></tr>`;
  return `<div class="fiche">
    <div class="f-head">
      <div><div class="logo dark">${logoHTML(true)}</div>
        <div class="f-ident">${esc(S.raisonSociale || S.nom)}<br>${esc(S.adresse)}${S.adresse ? '<br>' : ''}${esc(cpv(S))}<br>${esc([S.email, S.tel].filter(Boolean).join(' · '))}</div></div>
      <div class="f-title"><h1>FICHE DE POINTAGE</h1><div>Réf. ${esc(ref)}</div><div>Période : <b>${esc(per.label)}</b></div><div>Éditée le ${fmtDate(todayStr())}</div></div>
    </div>
    <div class="f-blocks">
      <div class="f-block"><b class="h">Client</b><b>${esc(c.nom)}</b><br>${esc(c.adresse || '')}${c.adresse ? '<br>' : ''}${esc(cpv(c))}
        ${contact ? `<br>À l'attention de : ${esc(nomContact(contact))}${contact.fonction ? ', ' + esc(contact.fonction) : ''}` : ''}</div>
      <div class="f-block"><b class="h">Intervenant</b>${esc(USER?.displayName || S.raisonSociale || S.nom)}<br>
        Base de calcul : 1 jour = ${num(hJ())} h<br>${FI.factOnly ? 'Temps facturable uniquement' : 'Tous les temps pointés'}</div>
    </div>
    <table><thead><tr>${FI.detail ? '<th>Date</th><th>Tâche</th><th>Travaux réalisés</th><th>Lieu</th>' : '<th>Projet</th>'}<th class="num">Heures</th><th class="num">Jours</th></tr></thead>
      <tbody>${rows}</tbody></table>
    <div class="f-visa">
      <div><b>L'intervenant</b>Date :<br><br>Signature :</div>
      <div><b>Le client — Bon pour accord</b>Nom, fonction :<br><br>Date :<br><br>Signature et cachet :</div>
    </div>
    <div class="f-foot">${esc([S.raisonSociale || S.nom, S.siret ? 'SIRET ' + S.siret : '', S.adresse, cpv(S)].filter(Boolean).join(' · '))}</div>
  </div>`;
}

      <label class="fld chk"><input type="checkbox" name="factOnly" ${FI.factOnly ? 'checked' : ''}> Facturable uniquement</label>
      <label class="fld chk"><input type="checkbox" name="detail" ${FI.detail ? 'checked' : ''}> Détail par jour</label>
      <label class="fld chk"><input type="checkbox" name="montant" ${FI.montant ? 'checked' : ''}> Afficher les montants (TJM)</label>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn primary" data-act="fiche-print">Imprimer / Enregistrer en PDF</button>
      <span class="small muted">Dans la fenêtre d'impression, choisissez « Enregistrer au format PDF ».</span></div>
  </div>
  <div class="fiche-wrap" id="fiche-preview">${ficheHTML()}</div>`;
};
VIEWS.fiches_after = () => {
  const f = $('#fi-form'); if (!f) return;
  f.addEventListener('change', e => {
    const el = e.target; if (!el.name) return;
    FI[el.name] = el.type === 'checkbox' ? el.checked : el.value;
    if (el.name === 'clientId') FI.projetId = '';
    if (el.name === 'mode' && FI.mode === 'libre' && !FI.du) { FI.du = FI.mois + '-01'; FI.au = lastDayOfMonth(FI.mois); }
    render();
  });
};
function printFiche() {
  const html = ficheHTML();
  if (!html.includes('class="fiche"')) return toast('Rien à imprimer : vérifiez client et période.', true);
  $('#print-area').innerHTML = html;
  const c = byId('clients', FI.clientId), per = fichePeriode();
  const old = document.title;
  document.title = `Fiche-pointage_${slug(c?.nom)}_${FI.mode === 'mois' ? FI.mois : per.du + '_' + per.au}`;
  const restore = () => { document.title = old; $('#print-area').innerHTML = ''; window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  window.print();
}

    <p class="small muted">Ces informations apparaissent en en-tête et pied des fiches de pointage.</p>
    <form id="set-form" class="grid-form">
      ${[{ k: 'nom', label: 'Nom commercial' }, { k: 'mention', label: 'Mention sous le logo' }, { k: 'slogan', label: 'Slogan (fiches)' }, { k: 'raisonSociale', label: 'Raison sociale' }, { k: 'siret', label: 'SIRET' },
         { k: 'adresse', label: 'Adresse', full: true }, { k: 'cp', label: 'Code postal' }, { k: 'ville', label: 'Ville' }, { k: 'email', label: 'E-mail' }, { k: 'tel', label: 'Téléphone' },
         { k: 'heuresJour', label: 'Heures par jour (conversion h → j)', type: 'number', step: '0.25', min: 1 }].map(f => fieldHTML(f, withCpVille(SETTINGS)[f.k])).join('')}
      <div class="full"><button class="btn primary" type="submit">Enregistrer</button></div>
    </form>
  </div>
  <div class="card"><h2>Sauvegarde</h2>
    <p class="small">Exportez régulièrement vos données dans un fichier JSON et rangez-le dans votre dossier OneDrive.
      ${SETTINGS.lastBackup ? `Dernière sauvegarde : <b>${new Date(SETTINGS.lastBackup).toLocaleString('fr-FR')}</b>.` : '<b>Aucune sauvegarde effectuée.</b>'}</p>
    <div class="row"><button class="btn primary" data-act="export">Exporter (JSON)</button>
      <label class="btn">Importer un fichier JSON…<input type="file" id="imp-file" accept=".json,application/json" hidden></label></div>
    <p class="small muted" style="margin-top:10px">L'import ajoute ou met à jour les éléments du fichier, sans rien effacer d'autre.</p>
  </div>
  <div class="card small muted">
    Version ${APP_VERSION} · Mode : <b>${DEMO ? 'démo (stockage local du navigateur)' : 'Firebase'}</b> ·
    ${DB.clients.length} clients · ${DB.partenaires.length} fournisseurs/partenaires · ${DB.projets.length} projets · ${DB.pointages.length} pointages · ${DB.interactions.length} échanges
    ${DEMO ? `<div style="margin-top:8px"><button class="btn sm danger" data-act="demo-reset">Effacer les données de démo</button></div>` : ''}
  </div>`;
VIEWS.reglages_after = () => {
  const f = $('#set-form');
  if (f) f.onsubmit = e => {
    e.preventDefault();
    const v = {}; ['nom', 'mention', 'slogan', 'raisonSociale', 'siret', 'adresse', 'cp', 'ville', 'email', 'tel'].forEach(k => v[k] = f.elements[k].value.trim());
    v.cpVille = '';
    v.heuresJour = parseFloat(String(f.elements.heuresJour.value).replace(',', '.')) || 7;
    safe(() => Store.saveSettings(v), 'Réglages enregistrés');
  };
  if (f) villeAuto(f);
  const imp = $('#imp-file');
  if (imp) imp.onchange = () => { const file = imp.files[0]; if (file) importJSON(file); imp.value = ''; };
};
function exportJSON() {
  const data = { app: 'DCPI', version: APP_VERSION, exportedAt: new Date().toISOString(), settings: SETTINGS };
  COLS.forEach(c => data[c] = DB[c]);
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `dcpi-sauvegarde-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  safe(() => Store.saveSettings({ lastBackup: new Date().toISOString() }), 'Sauvegarde téléchargée');
}
// Sauvegarde automatique : 1 fichier JSON téléchargé à la première ouverture de chaque journée
// (contournement du forfait Blaze, comme sur l'outil de pointage MPE)
let autoBackupDone = false;
function autoBackup() {
  if (autoBackupDone || DEMO) return; autoBackupDone = true;
  const vide = COLS.every(c => !DB[c].length);
  const dejaFait = SETTINGS.lastBackup && toISO(new Date(SETTINGS.lastBackup)) === todayStr();
  if (!vide && !dejaFait) { exportJSON(); toast('Sauvegarde du jour téléchargée — à ranger dans OneDrive'); }
}
async function importJSON(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { return toast('Fichier JSON illisible', true); }
  if (!['DCPI', 'DC-PI'].includes(data.app)) return toast('Ce fichier n\'est pas une sauvegarde DCPI', true);
  const counts = COLS.map(c => `${(data[c] || []).length} ${c}`).join(', ');
  if (!confirm(`Importer ${counts} ?\nLes éléments existants avec le même identifiant seront remplacés ; les autres sont conservés.`)) return;
  await safe(async () => {
    for (const c of COLS) for (const rec of (data[c] || [])) if (rec && rec.id) await Store.save(c, rec, true);
    if (data.settings) { const { lastBackup, ...s } = data.settings; await Store.saveSettings(s); }
  }, 'Import terminé');
}

/* =====================================================================
   ACTIONS (délégation d'événements)
   ===================================================================== */
const ACTIONS = {
  goto: (el, id) => go(id),
  export: () => exportJSON(),
  'relance-ok': (el, id) => { const i = byId('interactions', id); if (i) safe(() => Store.save('interactions', { ...i, relanceFaite: true }), 'Relance marquée faite'); },
  'crm-open': (el, id) => { CRM.sel = id; go('crm'); },
  'client-new': () => editClient(null),
  'client-edit': (el, id) => editClient(byId('clients', id)),
  'contact-new': (el, id) => editContact(el.dataset.col || 'clients', id, null),
  'contact-edit': (el, id) => editContact(el.dataset.col || 'clients', id, +el.dataset.t),
  'inter-new': (el, id) => editInteraction(el.dataset.col || 'clients', id, null),
  'inter-edit': (el, id) => { const i = byId('interactions', id); if (i) i.partenaireId ? editInteraction('partenaires', i.partenaireId, i) : editInteraction('clients', i.clientId, i); },
  'part-open': (el, id) => { PAR.sel = id; go('partenaires'); },
  'part-new': () => editPartenaire(null),
  'part-edit': (el, id) => editPartenaire(byId('partenaires', id)),
  'prj-open': (el, id) => { PRJ.from = VIEW; PRJ.sel = id; go('projets'); },
  'prj-back': () => { PRJ.sel = null; go(PRJ.from && PRJ.from !== 'projets' ? PRJ.from : 'projets'); },
  'lst-sort': (el, id) => { LST.dir = LST.sort === id ? -LST.dir : (LST_COLS.find(c => c.k === id)?.num || LST_COLS.find(c => c.k === id)?.date ? -1 : 1); LST.sort = id; $('#lst-table').innerHTML = listeTableHTML(); },
  'lst-csv': () => exportListeCSV(),
  'prj-new': () => editProjet(null),
  'prj-new-for': (el, id) => editProjet(null, id),
  'prj-edit': (el, id) => editProjet(byId('projets', id)),
  'tache-new': (el, id) => editTache(id, null),
  'tache-edit': (el, id) => editTache(id, el.dataset.t),
  'fiche-from-prj': (el, id) => { const p = byId('projets', id); FI.clientId = p.clientId; FI.projetId = p.id; go('fiches'); },
  'fiche-print': () => printFiche(),
  'pt-nav': (el, id) => {
    const n = +id, t = todayStr();
    if (PT.mode === 'mois') { if (!n) PT.mois = t.slice(0, 7); else { const d = parseISO(PT.mois + '-01'); d.setMonth(d.getMonth() + n); PT.mois = toISO(d).slice(0, 7); } }
    else PT.week = n ? addDays(PT.week, 7 * n) : mondayOf(t);
    render();
  },
  'pt-mode': (el, id) => { PT.mode = id; if (id === 'mois') PT.mois = addDays(PT.week, 3).slice(0, 7); render(); },
  'pt-goweek': (el, id) => { PT.week = mondayOf(id); PT.mode = 'semaine'; render(); },
  'pt-add': (el, id) => editPointage(null, id),
  'pt-edit': (el, id) => { const x = byId('pointages', id); if (x) editPointage(x); },
  'pt-del': (el, id) => { if (confirm('Supprimer ce pointage ?')) safe(() => Store.remove('pointages', id), 'Pointage supprimé'); },
  'demo-reset': () => { if (confirm('Effacer toutes les données de démo de ce navigateur ?')) { localStorage.removeItem(DEMO_KEY); location.reload(); } }
};
document.addEventListener('click', e => {
  const tab = e.target.closest('#tabs button');
  if (tab) { if (tab.dataset.view === 'projets') PRJ.sel = null; return go(tab.dataset.view); }
  const el = e.target.closest('[data-act]');
  if (!el || el.closest('.modal')) return;
  if (el.tagName === 'A') e.preventDefault();
  ACTIONS[el.dataset.act]?.(el, el.dataset.id, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]'); if (!el) return;
  if (el.dataset.chg === 'pt-we') { PT.we = el.checked; render(); return; }
  if (el.dataset.chg === 'tache-statut') {
    const p = byId('projets', el.dataset.id); if (!p) return;
    const taches = (p.taches || []).map(t => t.id === el.dataset.t ? { ...t, statut: el.value } : t);
    safe(() => Store.save('projets', { ...p, taches }), 'Statut mis à jour');
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });

/* =====================================================================
   DÉMARRAGE & AUTHENTIFICATION
   ===================================================================== */
function showApp() {
  $('#login').hidden = true; $('#app').hidden = false;
  $('#demo-banner').hidden = !DEMO;
  $('#who').innerHTML = DEMO ? 'Mode démo' : `${esc(USER.email)}<button id="btn-logout">Déconnexion</button>`;
  const lo = $('#btn-logout'); if (lo) lo.onclick = () => firebase.auth().signOut();
  autoBackupDone = false; Store.start(); render();
}
function showLogin(msg = '') {
  $('#app').hidden = true; $('#login').hidden = false;
  document.querySelectorAll('[data-logo]').forEach(el => el.innerHTML = logoHTML(true));
  $('#login-err').textContent = msg;
}
if (DEMO) {
  USER = { displayName: '', email: 'demo' };
  showApp();
} else if (SDK_KO) {
  // Jamais de bascule silencieuse en mode démo : on bloque et on explique
  showLogin('');
  $('#btn-login').hidden = true;
  $('#login-err').innerHTML = 'Firebase n\'a pas pu être chargé (connexion, VPN ou bloqueur de publicités ?).<br>Vérifiez la connexion puis rechargez la page (Ctrl + F5).';
} else {
  firebase.initializeApp(FIREBASE_CONFIG);
  Store.fs = firebase.firestore();
  Store.fs.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  $('#btn-login').onclick = () => {
    const prov = new firebase.auth.GoogleAuthProvider();
    prov.setCustomParameters({ prompt: 'select_account' });
    firebase.auth().signInWithPopup(prov).catch(e => $('#login-err').textContent = 'Connexion impossible : ' + e.message);
  };
  firebase.auth().onAuthStateChanged(u => {
    Store.stop();
    if (!u) { USER = null; return showLogin(); }
    if ((u.email || '').toLowerCase() !== ALLOWED_EMAIL.toLowerCase()) {
      firebase.auth().signOut();
      return showLogin(`Le compte ${u.email} n'est pas autorisé.`);
    }
    USER = u; showApp();
  });
}
</script>
